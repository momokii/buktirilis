name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buktirilis
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: buktirilis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buktirilis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://buktirilis:ci-database-password@127.0.0.1:5432/buktirilis_test
      BUKTIRILIS_SECRET_KEY: ci-only-secret-key-with-enough-length-0123456789
      ARTIFACT_ROOT: /tmp/buktirilis-ci-artifacts
      ALLOW_LOOPBACK_LAB_TARGETS: "true"
      DEMO_SEED_ENABLED: "true"
      LAB_BASE_URL: http://127.0.0.1:18099
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Lint and format check
        working-directory: backend
        run: .venv/bin/ruff check app tests && .venv/bin/ruff format --check app tests
      - name: Types
        working-directory: backend
        run: .venv/bin/mypy app
      - name: Tests
        working-directory: backend
        run: .venv/bin/python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Type check and build
        working-directory: web
        run: npm run typecheck && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../web && npm ci
      - name: Dependency audit (Python)
        working-directory: backend
        run: .venv/bin/pip-audit
      - name: Dependency audit (Node)
        working-directory: web
        run: npm audit --audit-level=high
      - name: Static analysis
        working-directory: backend
        run: .venv/bin/bandit -q -r app
      - name: Secret scan
        run: backend/.venv/bin/detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Build images
        run: |
          docker build -t buktirilis-api ./backend
          docker build -t buktirilis-web ./web
          docker build -t buktirilis-lab ./lab
      - name: Image scan
        run: |
          for image in buktirilis-api buktirilis-web buktirilis-lab; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.66.0 image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$image"
          done

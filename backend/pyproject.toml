[project]
name = "buktirilis-backend"
version = "0.1.0"
description = "BuktiRilis API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.33",
    "reportlab==4.4.4",
    # Direct pin keeps Starlette on the patched 1.10 line; FastAPI allows >=0.46.
    "starlette==1.10.0",
    "sqlalchemy==2.0.45",
    "starlette==1.10.0",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "pypdf==6.21.4",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.14.2",
    "mypy==1.18.2",
    "types-requests==2.32.4.20250913",
    "types-pyyaml>=6.0.12.20261113",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "S105", "S106", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "E501"]
"app/demo/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["migrations/"]
